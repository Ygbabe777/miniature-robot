<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OFO Lab</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="lab.css">
</head>
<body>
<canvas id="scene"></canvas>
<div id="bubbles"></div>

<header id="top">
  <div class="logo"><img id="logo-img" src="brand/icon.png" alt=""><span class="cube" id="logo-cube"></span>OFO <b>LAB</b></div>
  <div class="chips">
    <div class="chip" data-i18n-title="tip_trials"><span data-i18n="chip_trials"></span><b id="c-trials">0</b></div>
    <div class="chip" data-i18n-title="tip_looks"><span data-i18n="chip_looks"></span><b id="c-looks">0</b></div>
    <div class="chip" data-i18n-title="tip_calls"><span data-i18n="chip_calls"></span><b id="c-calls">–</b></div>
    <div class="chip" id="c-ai-chip"><span>AI</span><b id="c-ai">–</b></div>
    <div class="lang"><button id="lang-it">IT</button><button id="lang-en">EN</button></div>
  </div>
</header>

<aside id="left" class="panel">
  <h2 data-i18n="agents_title"></h2>
  <div id="agents"></div>
  <h2 data-i18n="feed_title"></h2>
  <div id="feed"></div>
  <h2 data-i18n="papers_title"></h2>
  <div id="drop" class="drop"><span data-i18n="drop"></span><br><small><span data-i18n="drop_sub"></span> <code>ideas/</code></small>
    <input type="file" id="file" accept=".pdf,.txt,.md" multiple hidden></div>
  <div id="ideas"></div>
  <button id="ingest" class="btn small" data-i18n="ingest"></button>
  <h2 style="margin-top:12px" data-i18n="scout_title"></h2>
  <div id="scout"></div>
</aside>

<aside id="right" class="panel">
  <nav class="tabs">
    <button data-tab="chat" class="on" data-i18n="tab_chat"></button>
    <button data-tab="strategies"><span data-i18n="tab_strat"></span> <i id="n-strat"></i></button>
    <button data-tab="trader" data-i18n="tab_trader"></button>
    <button id="wide" class="narrow" data-i18n-title="tip_wide">⇔</button>
  </nav>
  <section id="tab-chat" class="tabbody">
    <div id="msgs"></div>
    <div id="sugg"></div>
    <form id="chatform"><input id="chatin" autocomplete="off" data-i18n-ph="chat_ph"><button class="btn" data-i18n="send"></button></form>
  </section>
  <section id="tab-strategies" class="tabbody" hidden>
    <div id="pending"></div>
    <div id="jobs"></div>
    <div id="studies"></div>
    <div id="reqs"></div>
  </section>
  <section id="tab-trader" class="tabbody" hidden>
    <div class="trow"><div class="seg" id="tf"></div><div class="seg" id="rng"></div></div>
    <div class="tsel"><span data-i18n="t_strat"></span><select id="tstrat"></select></div>
    <div id="tinfo" class="tinfo"></div>
    <div id="tlegend" class="tlegend"></div>
    <div id="tchart"></div>
    <div class="tnote" id="tnote"></div>
    <h2 style="margin:10px 0 4px" data-i18n="acct_title"></h2>
    <div id="accts"></div>
  </section>
</aside>

<div id="modal" hidden>
  <div class="sheet">
    <button id="close" class="btn small" data-i18n="close"></button>
    <div id="detail"></div>
  </div>
</div>
<div id="credit">Charts: TradingView Lightweight Charts™ · 3D: three.js</div>

<script src="vendor/three.min.js"></script>
<script src="vendor/OrbitControls.js"></script>
<script src="vendor/chart.umd.min.js"></script>
<script src="vendor/lightweight-charts.js"></script>
<script src="theme.js"></script>
<script src="scene.js"></script>
<script src="charts.js"></script>
<script src="i18n.js"></script>
<script src="ui.js"></script>
</body>
</html>
