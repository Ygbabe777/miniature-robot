# OFO Council - configurazione centrale. NESSUN segreto qui: la chiave sta in .env
omniroute:
  base_url: "http://localhost:20128"
  chat_path: "/v1/chat/completions"
  timeout_seconds: 90
  max_retries: 3
  backoff_base_seconds: 1.0
  backoff_max_seconds: 30.0
  jitter_seconds: 0.5
  retry_status_codes: [429, 500, 502, 503, 504]

models:
  price_action: "super-120b"
  options_flow: "ultra-550b"
  strategist: "ultra-550b"
  risk_manager: "super-120b"
  judge: "gemma-4-31b-it"
  vision_extractor: "super-120b"   # deve supportare immagini: cambia con il tuo modello vision

fallback_models:
  price_action: "gemma-4-31b-it"
  options_flow: "super-120b"
  strategist: "super-120b"
  risk_manager: "gemma-4-31b-it"
  judge: "super-120b"
  vision_extractor: "gemma-4-31b-it"

debate:
  max_scenarios: 2
  parallel_analysts: true
  judge_min_score: 60

risk:
  minimum_rr: 1.5
  max_daily_r: 3.0
  risk_per_scenario_r: 1.0

features:
  timeframe_minutes: 5
  atr_period: 14
  value_area_pct: 0.70
  profile_bin_size: 5.0      # punti NQ per bin del volume profile
  hvn_ratio: 1.3             # HVN: picco >= ratio * volume medio dei bin
  lvn_ratio: 0.5             # LVN: valle <= ratio * volume medio dei bin
  rth_start: "09:30"         # orario exchange (America/New_York), timestamp naive
  rth_end: "16:00"
  min_sessions: 3
  tick_size: 0.25
  intermarket:             # ES come strumento di conferma di NQ
    enabled: true
    es_profile_bin_size: 1.0
    direction_threshold_pct: 0.10
    min_correlation: 0.60
    corr_bars: 1200
    divergence_bps: 15
  regime:
    high_vol_ratio: 1.6
    low_vol_ratio: 0.6
    trend_displacement_atr: 0.35
    overnight_range_hv_atr: 1.0

grounding:
  tolerance_points_min: 2.0
  tolerance_atr_mult: 0.5
  rr_tolerance: 0.3

paths:
  data_dir: "data"
  prompts_dir: "prompts"
  reports_dir: "reports"
  transcripts_dir: "transcripts"
  logs_dir: "logs"
  journal: "journal.csv"

ui:
  bubble_seconds: 6
  event_seconds: 1.6
  default_speed: 1.0
  speeds: [0.5, 1.0, 2.0, 4.0]

# Integrazione GexBot (docs.gexbot.com). La chiave GEXBOT_API_KEY sta SOLO in .env
gexbot:
  base_url: "https://api.gex.bot/v2"
  ticker: "NQ_NDX"
  category: "zero"
  convert: true            # converte i livelli NDX -> NQ con /futures/conversion
  conversion_ticker: "NDX"
  future: "NQ"
  es_ticker: "ES_SPX"
  es_conversion_ticker: "SPX"
  es_future: "ES"
  wall_basis: "vol"        # vol | oi
  max_age_hours: 18
  timeout_seconds: 30
  max_retries: 3

# Intake di screenshot / messaggi / PDF (sempre con conferma umana prima dell'uso)
intake:
  inbox_dir: "data/inbox"
  max_file_mb: 10
  plausible_min: 1000
  plausible_max: 100000
  es_plausible_min: 1000
  es_plausible_max: 20000
  vision_enabled: true
  max_pdf_pages: 20
